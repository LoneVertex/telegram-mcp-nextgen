[build-system]
requires = ["setuptools>=75,<77", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp"
version = "4.1.0"
description = "Production-oriented Telegram integration for MCP clients"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "LoneVertex"}
]
maintainers = [
    {name = "LoneVertex"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.28,<1",
    "mcp[cli]>=1.29,<2",
    "pillow>=11,<13",
    "python-dotenv>=1.1,<2",
    "python-json-logger>=3.3,<5",
    "qrcode>=8.2,<9",
    "telethon>=1.44,<2",
]

[project.optional-dependencies]
proxy = ["python-socks>=2.4,<3"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/LoneVertex/telegram-mcp-nextgen"
Repository = "https://github.com/LoneVertex/telegram-mcp-nextgen"
Issues = "https://github.com/LoneVertex/telegram-mcp-nextgen/issues"

[project.scripts]
telegram-mcp = "telegram_mcp.runner:main"
telegram-mcp-generate-session = "session_string_generator:main"

[tool.setuptools]
py-modules = ["main", "sanitize", "session_string_generator"]

[tool.setuptools.packages.find]
include = ["telegram_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
    "telegram_mcp.config",
    "telegram_mcp.core",
    "telegram_mcp.db",
    "telegram_mcp.models",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["build", "dist", ".venv", "screenshots"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
exclude = '(^|/)(build|dist|\\.venv)/'

[[tool.mypy.overrides]]
module = "telegram_mcp.config"
allow_subclassing_any = true
disallow_untyped_decorators = false
