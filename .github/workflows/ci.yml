name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: dummy_hash
      TELEGRAM_SESSION_NAME: test_session
      TELEGRAM_SEND_ENABLED: "true"
      TELEGRAM_DESTRUCTIVE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q --cov=telegram_mcp.config --cov=telegram_mcp.core --cov=telegram_mcp.db --cov=telegram_mcp.models --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  quality:
    name: Lint / Type / Build
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: dummy_hash
      TELEGRAM_SESSION_NAME: test_session
      TELEGRAM_SEND_ENABLED: "true"
      TELEGRAM_DESTRUCTIVE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: ruff check telegram_mcp/config.py telegram_mcp/core telegram_mcp/db telegram_mcp/models telegram_mcp/tools/cache.py tests/test_nextgen_core.py tests/test_nextgen_tools.py tests/test_glama_and_tdqs.py
      - run: mypy --explicit-package-bases telegram_mcp/config.py telegram_mcp/core telegram_mcp/db telegram_mcp/models
      - run: python -m compileall -q telegram_mcp main.py sanitize.py session_string_generator.py
      - run: python -m build
      - run: pip-audit -r requirements.txt

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file Dockerfile --tag telegram-mcp:ci .
      - run: cp .env.example .env
      - run: docker compose config
