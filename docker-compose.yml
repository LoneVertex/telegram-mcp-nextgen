services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      TELEGRAM_DATA_DIR: /var/lib/telegram-mcp
      TELEGRAM_MCP_TIER: ${TELEGRAM_MCP_TIER:-core}
      TELEGRAM_SEND_ENABLED: ${TELEGRAM_SEND_ENABLED:-false}
      TELEGRAM_DESTRUCTIVE_ENABLED: ${TELEGRAM_DESTRUCTIVE_ENABLED:-false}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - telegram_state:/var/lib/telegram-mcp
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  telegram_state:
